# Эталонный пресет: все поля с дефолтными значениями (= Preset::default()).
# Пропорции сняты с первого (синего) паука из видео: 1 px видео ≈ 1 pt.
# В других пресетах достаточно указать только то, что отличается.
# Цвета: "#rrggbb" или "#rrggbbaa". Неизвестный ключ — ошибка загрузки.
# Файл перечитывается на лету при сохранении (hot-reload).

name = "spider"            # игнорируется: имя берётся из имени файла

color_leg   = "#3a3aff"    # линии ног
color_joint = "#ffffff"    # точки на суставах
color_body  = "#7fe0b0"    # корпус
color_head  = "#ffffff"    # яркая точка-«голова»
color_ring  = "#8080a059"  # отладка: кольцо вокруг курсора (радиус остановки)
color_debug = "#3030a099"  # отладка: кружки целей ступней
line_width  = 1.2          # толщина линий, pt
joint_dot   = 1.5          # радиус точек на суставах, pt

[body]
max_speed  = 520.0         # макс. скорость, pt/с
max_accel  = 2600.0        # макс. ускорение, pt/с²
turn_rate  = 9.0           # скорость поворота корпуса к направлению движения, 1/с
stop_radius = 45.0         # радиус кольца: здесь паук останавливается
slow_radius = 160.0        # с этого расстояния начинает тормозить
half_len   = 12.5          # полудлина корпуса, pt
half_width = 7.5           # полуширина корпуса, pt

[legs]
spread_deg = [40.0, 80.0, 115.0, 150.0]  # углы rest-позиций пар от «вперёд», град (спереди назад); длина = число пар
hip_along  = [0.3, 0.1, -0.1, -0.3]      # крепление пар вдоль тела, доля half_len (+ = вперёд); та же длина
rest_dist  = 95.0          # расстояние от бедра до rest-позиции ступни
segments   = [46.0, 46.0, 46.0]# длины сегментов от бедра к ступне: 2 → аналитический IK, 3+ → FABRIK
style      = "straight"    # straight | curve | dotted
step_threshold   = 34.0    # ступня шагает, когда отстала от цели дальше этого
settle_threshold = 5.0     # порог «доводочного» шага, когда паук стоит
step_duration    = 0.1     # длительность шага, с
step_lead  = 0.05          # упреждение цели по скорости тела, с
lift       = 9.0           # выгиб колена наружу в середине шага (имитация подъёма)
